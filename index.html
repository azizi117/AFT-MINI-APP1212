<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald Coin</title>
<style>
  body {
    background: #04100b;
    color: #ffffff;
    font-family: Tahoma, sans-serif;
    text-align: center;
    padding: 20px;
    margin: 0;
  }
  .card {
    background: #0b2214;
    border: 1px solid #00e58b;
    border-radius: 20px;
    padding: 20px;
    max-width: 400px;
    margin: 20px auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .balance {
    font-size: 36px;
    font-weight: bold;
    color: #00e58b;
    margin: 15px 0;
  }
  .btn {
    background: linear-gradient(135deg, #00ff9d, #00a968);
    color: #031a0e;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 15px;
    cursor: pointer;
    width: 100%;
    margin-top: 15px;
  }
  .btn:active {
    transform: scale(0.96);
  }
</style>
</head>
<body>

  <h1>EMERALD COIN</h1>
  
  <div class="card">
    <p>موجودی شما:</p>
    <div class="balance" id="score">0</div>
    <button class="btn" onclick="addCoin()">💎 ضربه بزن و بگیر!</button>
  </div>

<script>
  let score = localStorage.getItem('emc_score') ? parseInt(localStorage.getItem('emc_score')) : 0;
  document.getElementById('score').textContent = score;

  function addCoin() {
    score += 1;
    document.getElementById('score').textContent = score;
    localStorage.setItem('emc_score', score);
  }
</script>

</body>
</html>
