<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030d08">
<title>EMERALD COIN PRO | 3D Digital Mini App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg-deep: #020906;
  --emerald-neon: #00ffa3;
  --emerald-mid: #00b874;
  --emerald-dark: #042417;
  --gold-neon: #ffd470;
  --danger-neon: #ff4d6d;
  --text-main: #f3fff9;
  --text-muted: #8cb39e;
  --glass-bg: linear-gradient(145deg, rgba(20, 62, 41, 0.42), rgba(5, 22, 14, 0.72));
  --glass-border: rgba(0, 255, 163, 0.25);
  --glass-highlight: rgba(255, 255, 255, 0.14);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  margin: 0;
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(circle at 20% 0%, rgba(0, 255, 163, 0.16) 0%, transparent 40%),
    radial-gradient(circle at 85% 25%, rgba(0, 184, 116, 0.12) 0%, transparent 45%),
    radial-gradient(circle at 50% 95%, rgba(0, 255, 163, 0.1) 0%, transparent 50%);
  color: var(--text-main);
  font-family: 'Vazirmatn', sans-serif;
  min-height: 100vh;
  padding-bottom: 105px;
  overflow-x: hidden;
}

/* 3D GLASSMORPHIC PANEL */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  border-top: 1px solid var(--glass-highlight);
  border-left: 1px solid var(--glass-highlight);
  border-radius: 26px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 
    0 18px 40px rgba(0, 0, 0, 0.65),
    inset 0 1px 1px rgba(255, 255, 255, 0.15),
    inset 0 -3px 10px rgba(0, 0, 0, 0.45);
  position: relative;
  overflow: hidden;
}

/* 3D DIGITAL GLASS BUTTONS */
.glass-btn-3d {
  position: relative;
  border: 1px solid rgba(0, 255, 163, 0.45);
  border-top: 1.5px solid rgba(255, 255, 255, 0.5);
  border-radius: 16px;
  padding: 13px 18px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 900;
  color: #021a0f;
  background: linear-gradient(135deg, rgba(72, 255, 188, 0.92), rgba(0, 194, 120, 0.85));
  backdrop-filter: blur(12px);
  box-shadow: 
    0 6px 0 #006b42,
    0 14px 26px rgba(0, 255, 163, 0.35),
    inset 0 2px 3px rgba(255, 255, 255, 0.6);
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
}

.glass-btn-3d:hover {
  filter: brightness(1.06);
}

.glass-btn-3d:active {
  transform: translateY(5px);
  box-shadow: 
    0 1px 0 #006b42,
    0 4px 12px rgba(0, 255, 163, 0.3),
    inset 0 1px 2px rgba(255, 255, 255, 0.4);
}

.glass-btn-3d:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

/* Secondary Translucent 3D Glass Button */
.glass-btn-dark {
  position: relative;
  border: 1px solid rgba(0, 255, 163, 0.28);
  border-top: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 16px;
  padding: 12px 16px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  color: var(--emerald-neon);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(0, 35, 20, 0.55));
  backdrop-filter: blur(16px);
  box-shadow: 
    0 5px 0 rgba(1, 14, 8, 0.9),
    0 10px 20px rgba(0, 0, 0, 0.5),
    inset 0 1px 1px rgba(255, 255, 255, 0.18);
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.glass-btn-dark:active {
  transform: translateY(4px);
  box-shadow: 
    0 1px 0 rgba(1, 14, 8, 0.9),
    0 3px 8px rgba(0, 0, 0, 0.5);
}

/* Gold 3D Glass Button */
.glass-btn-gold {
  border: 1px solid rgba(255, 212, 112, 0.55);
  border-top: 1.5px solid rgba(255, 255, 255, 0.65);
  border-radius: 16px;
  padding: 13px 18px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 900;
  color: #241600;
  background: linear-gradient(135deg, rgba(255, 232, 163, 0.95), rgba(217, 155, 38, 0.88));
  box-shadow: 
    0 6px 0 #7a5209,
    0 14px 25px rgba(255, 212, 112, 0.28),
    inset 0 2px 3px rgba(255, 255, 255, 0.7);
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.glass-btn-gold:active {
  transform: translateY(5px);
  box-shadow: 0 1px 0 #7a5209, 0 4px 10px rgba(255, 212, 112, 0.2);
}

/* Danger 3D Glass Button */
.glass-btn-danger {
  border: 1px solid rgba(255, 77, 109, 0.5);
  border-top: 1.5px solid rgba(255, 255, 255, 0.45);
  border-radius: 16px;
  padding: 13px 18px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 900;
  color: #fff;
  background: linear-gradient(135deg, rgba(255, 92, 122, 0.9), rgba(190, 24, 55, 0.85));
  box-shadow: 
    0 6px 0 #6e0b1e,
    0 12px 22px rgba(255, 77, 109, 0.3),
    inset 0 2px 2px rgba(255, 255, 255, 0.45);
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.glass-btn-danger:active {
  transform: translateY(5px);
  box-shadow: 0 1px 0 #6e0b1e;
}

.btn-block { width: 100%; display: block; margin-top: 12px; }
.btn-sm { padding: 8px 13px; font-size: 11px; border-radius: 12px; }

.app { max-width: 500px; margin: auto; padding: 14px; }

/* TOP HEADER */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo-3d {
  width: 46px; height: 46px; border-radius: 15px;
  background: linear-gradient(145deg, rgba(0, 255, 163, 0.35), rgba(0, 90, 55, 0.7));
  border: 1px solid rgba(0, 255, 163, 0.5);
  border-top: 1.5px solid rgba(255, 255, 255, 0.5);
  display: grid; place-items: center;
  font-size: 22px; color: var(--emerald-neon);
  box-shadow: 0 8px 20px rgba(0, 255, 163, 0.25), inset 0 1px 4px rgba(255, 255, 255, 0.4);
}
.brand-title { font-size: 16px; font-weight: 900; letter-spacing: 0.5px; }
.live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 700; color: var(--emerald-neon);
}
.pulse-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--emerald-neon);
  box-shadow: 0 0 10px var(--emerald-neon);
  animation: pulse 1.4s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.3)} }

.ticker-pill {
  background: rgba(10, 35, 23, 0.65);
  backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-top: 1px solid var(--glass-highlight);
  padding: 7px 12px;
  border-radius: 14px;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0,0,0,0.4);
}
.ticker-pill span { display: block; font-size: 9px; color: var(--text-muted); }
.ticker-pill b { font-size: 13px; color: var(--emerald-neon); font-variant-numeric: tabular-nums; }

/* HERO 3D CRYSTAL STAGE */
.hero-card { text-align: center; padding: 20px 16px; }
.balance-big {
  font-size: 40px; font-weight: 900;
  background: linear-gradient(180deg, #ffffff 20%, #8effd4 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 15px rgba(0, 255, 163, 0.3));
  font-variant-numeric: tabular-nums;
}
.usd-equiv {
  font-size: 12px; color: var(--gold-neon); font-weight: 700; margin-top: 2px;
}

.crystal-arena {
  position: relative;
  width: 220px; height: 220px;
  margin: 14px auto;
  display: grid; place-items: center;
  cursor: pointer;
  perspective: 800px;
}
.orbit-ring {
  position: absolute; inset: 6px;
  border-radius: 50%;
  border: 1.5px dashed rgba(0, 255, 163, 0.3);
  animation: spinSlow 24s linear infinite;
  pointer-events: none;
}
.orbit-ring-inner {
  position: absolute; inset: 22px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: radial-gradient(circle, rgba(0, 255, 163, 0.22) 0%, transparent 68%);
  box-shadow: inset 0 0 25px rgba(0, 255, 163, 0.25);
  pointer-events: none;
}
@keyframes spinSlow { to { transform: rotate(360deg); } }

.crystal-3d {
  width: 156px; height: 156px;
  filter: drop-shadow(0 15px 28px rgba(0, 255, 163, 0.55));
  animation: hoverFloat 3.2s ease-in-out infinite;
  transition: transform 0.08s cubic-bezier(0.2, 1.6, 0.4, 1);
  z-index: 3;
}
.crystal-arena:active .crystal-3d {
  transform: scale(0.89) rotateX(12deg);
}
@keyframes hoverFloat {
  0%, 100% { transform: translateY(0px) rotate(-2deg); }
  50% { transform: translateY(-9px) rotate(2deg); }
}

.shockwave {
  position: absolute;
  width: 140px; height: 140px;
  border-radius: 50%;
  border: 2px solid var(--emerald-neon);
  pointer-events: none;
  animation: waveOut 0.6s ease-out forwards;
}
@keyframes waveOut {
  0% { transform: scale(0.6); opacity: 0.9; }
  100% { transform: scale(1.65); opacity: 0; }
}

.float-tap {
